      security:
      - BearerAuth: []
      summary: Get User
      tags:
      - User
  /api/user/update:
    put:
      consumes:
      - application/json
      description: Update existing user info
      parameters:
      - description: User Update Data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.RespErr'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.RespErr'
      security:
      - BearerAuth: []
      summary: Update User
      tags:
      - User
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
